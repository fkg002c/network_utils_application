buildscript {
    apply from: 'version.gradle'
}

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace = 'com.fkg002c.networkutils.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.fkg002c.networkutils.app"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            proguardFiles(getDefaultProguardFile('proguard-android.txt'))
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            output.outputFileName = "NetworkUtilsApp_${versionName}_${variant.name}.apk"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx


    implementation project(':libnetworkutils:libnetworkutils')

    implementation libs.androidx.work.runtime.ktx
}
